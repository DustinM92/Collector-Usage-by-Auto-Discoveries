<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Frequency Chart</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Cell } = Recharts;

        function ServerFrequencyChart() {

vslgdclp25
vslgdclp26
vslgdclp26`;

          const frequencies = {};
          const items = rawData.split('\n');
          
          items.forEach(item => {
            const trimmed = item.trim();
            if (trimmed) {
              frequencies[trimmed] = (frequencies[trimmed] || 0) + 1;
            }
          });

          const chartData = Object.entries(frequencies)
            .map(([name, count]) => ({ name, count }))
            .sort((a, b) => a.name.localeCompare(b.name));

          const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#06b6d4'];

          return (
            <div className="w-full h-screen bg-gray-50 p-8">
              <div className="bg-white rounded-lg shadow-lg p-6 h-full">
                <h2 className="text-2xl font-bold text-gray-800 mb-2">Server Frequency Distribution</h2>
                <p className="text-gray-600 mb-6">Count of occurrences for each server</p>
                
                <ResponsiveContainer width="100%" height="85%">
                  <BarChart data={chartData} margin={{ top: 20, right: 30, left: 20, bottom: 80 }}>
                    <CartesianGrid strokeDasharray="3 3" />
                    <XAxis 
                      dataKey="name" 
                      angle={-45} 
                      textAnchor="end" 
                      height={100}
                      tick={{ fontSize: 12 }}
                    />
                    <YAxis label={{ value: 'Count', angle: -90, position: 'insideLeft' }} />
                    <Tooltip 
                      contentStyle={{ backgroundColor: '#f9fafb', border: '1px solid #e5e7eb' }}
                      formatter={(value) => [`${value} occurrences`, 'Count']}
                    />
                    <Legend />
                    <Bar dataKey="count" name="Occurrences" radius={[8, 8, 0, 0]}>
                      {chartData.map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={colors[index % colors.length]} />
                      ))}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
                
                <div className="mt-4 text-sm text-gray-600">
                  Total entries: {items.length} | Unique servers: {chartData.length}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ServerFrequencyChart />);
    </script>
</body>
</html>
